<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор ссылки — СмартРезерв</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/munoret-prog/img-drop@main/images/smart-logo.png">
<style>
  :root {
    --yellow: #FFCC00;
    --ink: #1A1A1A;
    --bg: #E6B800;
    --muted: #8a8a8a;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
    background: #ffffff;
    border-radius: var(--radius);
    padding: 40px 32px 48px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.10);
  }
  img.logo { width: 100px; height: 100px; margin: 0 auto 16px; display: block; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  #keyInput {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 2px solid #e5e5e5;
    font-size: 16px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    margin-bottom: 12px;
  }
  #keyInput:focus { outline: none; border-color: var(--yellow); }

  button {
    border: none;
    border-radius: 12px;
    padding: 16px 24px;
    font-size: 16px;
    font-weight: 700;
    background: var(--yellow);
    color: var(--ink);
    cursor: pointer;
    width: 100%;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: default; }

  #result { margin-top: 24px; display: none; text-align: left; }
  #result.show { display: block; }
  .link-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  #shortOut {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #e5e5e5;
    font-size: 15px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--ink);
    background: #fafafa;
  }
  .copy-btn {
    width: auto;
    white-space: nowrap;
    padding: 12px 16px;
  }
  #status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 18px; }
  #status.error { color: #c0392b; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://cdn.jsdelivr.net/gh/munoret-prog/img-drop@main/images/smart-logo.png" alt="Smart">
    <h1>Ссылка для партнёра</h1>
    <p class="sub">Вставь ключ активации — получишь короткую ссылку</p>

    <input type="text" id="keyInput" placeholder="dhbQ5l_cTdKJRqsu_uOhEg" autocomplete="off">
    <button id="genBtn">Создать короткую ссылку</button>

    <div id="status"></div>

    <div id="result">
      <div class="link-row">
        <input id="shortOut" type="text" readonly>
        <button class="copy-btn" id="copyBtn">Скопировать</button>
      </div>
    </div>
  </div>

<script>
  const BASE_URL = "https://munoret-prog.github.io/smart-key-activate/";

  const keyInput = document.getElementById("keyInput");
  const genBtn = document.getElementById("genBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const shortOut = document.getElementById("shortOut");
  const copyBtn = document.getElementById("copyBtn");

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("error", !!isError);
  }

  keyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") genBtn.click();
  });

  genBtn.addEventListener("click", async () => {
    const key = keyInput.value.trim();
    if (!key) {
      setStatus("Вставь ключ активации", true);
      return;
    }

    resultEl.classList.remove("show");
    setStatus("Сокращаю…");
    genBtn.disabled = true;

    try {
      const fullUrl = BASE_URL + "?key=" + encodeURIComponent(key);
      const resp = await fetch("https://clck.ru/--?url=" + encodeURIComponent(fullUrl));
      if (!resp.ok) throw new Error("Ошибка " + resp.status);
      const shortUrl = (await resp.text()).trim();
      if (!shortUrl.startsWith("http")) throw new Error("Не удалось сократить");

      shortOut.value = shortUrl;
      resultEl.classList.add("show");
      setStatus("Готово");
    } catch (err) {
      setStatus("Не получилось: " + err.message, true);
    } finally {
      genBtn.disabled = false;
    }
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(shortOut.value);
      copyBtn.textContent = "Скопировано ✓";
      setTimeout(() => (copyBtn.textContent = "Скопировать"), 1500);
    } catch {
      shortOut.select();
      document.execCommand("copy");
    }
  });
</script>
</body>
</html>
