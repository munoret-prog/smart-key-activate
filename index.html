<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ключ активации — СмартРезерв</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/munoret-prog/img-drop@main/images/smart-logo.png">
<style>
  :root {
    --yellow: #FFCC00;
    --ink: #1A1A1A;
    --bg: #E6B800;
    --muted: #8a8a8a;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
    background: #ffffff;
    border-radius: var(--radius);
    padding: 40px 32px 48px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.10);
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 15px;
  }
  #keyBox {
    background: #fffbe6;
    border: 2px dashed #e5c700;
    border-radius: var(--radius);
    padding: 24px 16px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    word-break: break-all;
    margin-bottom: 20px;
  }
  #keyBox.empty {
    color: var(--muted);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: normal;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 16px 24px;
    font-size: 16px;
    font-weight: 700;
    background: var(--yellow);
    color: var(--ink);
    cursor: pointer;
    width: 100%;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  #qrBox {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }
  #qrBox svg {
    width: 180px;
    height: 180px;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e5e5e5;
    padding: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="https://cdn.jsdelivr.net/gh/munoret-prog/img-drop@main/images/smart-logo.png" alt="Smart" style="width:100px;height:100px;margin:0 auto 16px;display:block;">
    <h1>Ваш ключ активации</h1>
    <p class="sub">Скопируйте и вставьте его в приложение СмартРезерв</p>

    <div id="keyBox">—</div>
    <button id="copyBtn" disabled>Скопировать ключ</button>
    <div id="qrBox"></div>

    <div class="hint">
      Откройте приложение СмартРезерв → поле активации → вставьте скопированное значение (или отсканируйте QR, если приложение поддерживает сканер).
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const key = params.get("key");

  const keyBox = document.getElementById("keyBox");
  const copyBtn = document.getElementById("copyBtn");
  const qrBox = document.getElementById("qrBox");

  if (key) {
    keyBox.textContent = key;
    copyBtn.disabled = false;
    const qr = qrcode(0, "M");
    qr.addData(key);
    qr.make();
    qrBox.innerHTML = qr.createSvgTag({ scalable: true });
  } else {
    keyBox.textContent = "Ключ не передан — проверьте ссылку";
    keyBox.classList.add("empty");
  }

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(key);
      copyBtn.textContent = "Скопировано ✓";
      setTimeout(() => (copyBtn.textContent = "Скопировать ключ"), 1500);
    } catch {
      const range = document.createRange();
      range.selectNode(keyBox);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand("copy");
      window.getSelection().removeAllRanges();
      copyBtn.textContent = "Скопировано ✓";
      setTimeout(() => (copyBtn.textContent = "Скопировать ключ"), 1500);
    }
  });
</script>
</body>
</html>
